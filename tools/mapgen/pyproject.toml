[project]
name = "ww2-mapgen"
version = "0.1.0"
description = "由 OpenHistoricalMap、Natural Earth、historical-basemaps 与 geoBoundaries 生成 world-1936 模组的省份地图"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "numpy>=1.26",
    "topojson>=1.9",
]
